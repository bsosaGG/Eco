server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    # Para que el router de Vue funcione correctamente
    try_files $uri $uri/ /index.html;
  }

  # --- INICIO DEL NUEVO BLOQUE (REVERSE PROXY) ---
  location /api/ {
    # Elimina el prefijo /api/ antes de reenviar, si es necesario.
    # Si tu API espera recibir /usuarios en lugar de /api/usuarios, esta línea es útil.
    # Por ahora la dejamos comentada por si no es necesaria.
    # rewrite /api/(.*) /$1 break;

    # Pasa la petición al servicio de la API, usando su nombre de servicio de Docker.
    # Docker se encargará de resolver "denuncias_api_scspr" a la IP interna correcta.
    proxy_pass http://denuncias_api_scspr:3000;

    # Añade cabeceras importantes para que la API sepa de dónde viene la petición original.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # --- FIN DEL NUEVO BLOQUE ---

  location ~* \.(?:ico|css|js|gif|jpe?g|png)$ {
    expires 1y;
    add_header Cache-Control "public";
  }
}
