server {
  listen 80;
  server_name localhost;

  client_max_body_size 100M;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    # Para que el router de Vue funcione correctamente
    try_files $uri $uri/ /index.html;
  }

  # --- INICIO DEL NUEVO BLOQUE (REVERSE PROXY) ---
  # CORRECCIÓN: Agregamos "^~" al inicio.
  # Esto fuerza a Nginx a usar este bloque si la URL empieza con /api/,
  # ignorando el bloque de abajo para imágenes .png/.jpg
  location ^~ /api/ {
    # Elimina el prefijo /api/ antes de reenviar, si es necesario.
    # rewrite /api/(.*) /$1 break;

    # Pasa la petición al servicio de la API
    proxy_pass http://denuncias_api_scspr:3000;

    # Añade cabeceras importantes
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # --- FIN DEL NUEVO BLOQUE ---

  # Este bloque capturaba tus imágenes de la API erróneamente.
  # Ahora, gracias al "^~" de arriba, solo afectará a los assets reales del frontend (logos, iconos del sitio web).
  location ~* \.(?:ico|css|js|gif|jpe?g|png)$ {
    expires 1y;
    add_header Cache-Control "public";
  }
}