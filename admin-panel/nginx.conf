server {
  listen 80;
  server_name localhost;

  # Directorio raíz donde se encuentran los archivos de la app
  root /usr/share/nginx/html;

  # Index por defecto
  index index.html;

  location / {
    # Intenta servir el archivo solicitado directamente,
    # luego como un directorio, y si falla,
    # redirige a /index.html para que Vue Router maneje la ruta.
    try_files $uri $uri/ /index.html;
  }

  # Opcional: Configuración para evitar errores de cache
  location ~* \.(?:ico|css|js|gif|jpe?g|png)$ {
    expires 1y;
    add_header Cache-Control "public";
  }
}