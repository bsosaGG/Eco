<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/core-humanis/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Core Humanis | Plataforma Tecnológica de Recursos Humanos SCSPR</title>
  <meta name="description"
    content="Sistema Integral de Gestión de Recursos Humanos y Expediente Digital Único - Secretaría de Comunicación Social de la Presidencia" />
  <!-- Fuentes Google: Inter, Outfit & Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="app">
    <!-- Splash Screen Institucional mientras carga la app -->
    <div class="app-initial-splash">
      <div class="splash-content">
        <div class="splash-crest">🇬🇹</div>
        <h1 class="splash-title">SECRETARÍA DE COMUNICACIÓN SOCIAL DE LA PRESIDENCIA</h1>
        <h2 class="splash-subtitle">CORE HUMANIS &bull; RECURSOS HUMANOS</h2>
        <div class="splash-spinner"></div>
        <p class="splash-loading-text">Cargando plataforma institucional...</p>
      </div>
    </div>
    <style>
      .app-initial-splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #0b2545;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }

      .splash-content {
        text-align: center;
        padding: 2rem;
        max-width: 500px;
      }

      .splash-crest {
        font-size: 3.5rem;
        margin-bottom: 1rem;
        animation: pulse-crest 2s infinite ease-in-out;
      }

      .splash-title {
        font-family: 'Outfit', sans-serif;
        font-size: 0.95rem;
        letter-spacing: 1.5px;
        font-weight: 700;
        color: #93c5fd;
        margin-bottom: 0.25rem;
      }

      .splash-subtitle {
        font-size: 1.15rem;
        font-weight: 600;
        color: #ffffff;
        margin-bottom: 2rem;
      }

      .splash-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #60a5fa;
        border-radius: 50%;
        margin: 0 auto 1rem auto;
        animation: spin 0.8s linear infinite;
      }

      .splash-loading-text {
        font-size: 0.85rem;
        color: #94a3b8;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse-crest {

        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }

        50% {
          transform: scale(1.08);
          opacity: 0.85;
        }
      }
    </style>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
