server {
    listen 80;
    server_name localhost;

    port_in_redirect off;
    absolute_redirect off;

    location /core-humanis/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /core-humanis/index.html;
    }

    # Redireccion relativa temporal de raiz a /core-humanis/
    location = / {
        return 302 /core-humanis/;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
