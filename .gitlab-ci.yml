stages:
  - deploy

deploy_produccion:
  stage: deploy

  # 1. Esto le dice a GitLab que use el runner que etiquetamos
  tags:
    - principal

  # 2. Esto evita que el runner clone el proyecto en una carpeta nueva.
  #    Queremos que trabaje en la carpeta que ya existe.
  variables:
    GIT_STRATEGY: none

  # 3. Este es el "guion" que el runner ejecutará
  script:
    - echo "Iniciando despliegue en docker-host..."

    # 3a. Navegamos al directorio de tu proyecto en el servidor
    # (El runner lo ejecuta como 'hgatica', así que tiene permiso)
    - cd /home/hgatica/denuncias-scsp
    
    # 2. Aseguramos estar en la rama correcta
    # (El checkout a veces falla si hay cambios locales, por eso forzamos el reset antes si es necesario, 
    # pero seguiremos tu ejemplo simple primero).
    - git checkout main
    
    # 3. Pull usando HTTPS y el TOKEN del trabajo (Evita líos de SSH)
    - git pull https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git main
    
    # 4. Levantamos servicios (apaga admin_app y api, reconstruye y levanta)
    # Nota: Agregué --remove-orphans como en tu ejemplo bueno, es buena práctica.
    - docker compose stop admin_app denuncias_api_scspr calendar_app nginx
    - docker compose up -d --build --remove-orphans denuncias_api_scspr admin_app calendar_app nginx
    
    - echo "¡Despliegue completado!"
  
  only:
    - main
