server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy a la API si es necesario (aunque suele ir por otro puerto o subdominio)
    # location /api {
    #     proxy_pass http://denuncias_api_scspr:3000;
    # }
}
