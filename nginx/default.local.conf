server {
    listen 80;
    server_name localhost;

    # Redirigir / al admin panel
    location / {
        client_max_body_size 50M;
        proxy_pass http://admin_app_container:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Redirigir /calendario al contenedor calendar_app
    location /calendario {
        proxy_pass http://calendar_app_container:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Redirigir /juridica al contenedor juridica_app
    location /juridica {
        proxy_pass http://juridica_app_container:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Redirigir /impresiones al contenedor impresiones_app
    location /impresiones {
        proxy_pass http://impresiones_app_container:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Redirigir /correspondencia al contenedor impresiones_app
    location /correspondencia {
        proxy_pass http://impresiones_app_container:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Redirigir /api a la API globalmente
    location /api {
        client_max_body_size 50M;
        proxy_pass http://denuncias_api_scspr:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Nota: La API debe estar preparada para recibir peticiones con prefijo /api
        # O bien usamos rewrite para quitarlo si la API escucha en /
        # rewrite ^/api/(.*) /$1 break;
        # Asumiremos que la API monta sus rutas en /api o que necesitamos pasar /api/v1/etc tal cual.
    }

    # Redirigir /transportes al contenedor transportes_app
    location /transportes {
        proxy_pass http://transportes_app_container:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Redirigir /adquisiciones al contenedor adquisiciones_app (SICOMPRAS)
    location /adquisiciones {
        proxy_pass http://adquisiciones_app_container:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Redirigir /plan-medios al contenedor plan_medios_app (Plan de Medios, Vue). Su API vive en /api/plan-medios
    # y la atiende la API del core (location /api), ya no un servicio Python aparte.
    location /plan-medios {
        proxy_pass http://plan_medios_app_container:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Resolver interno de Docker para resolución dinámica de nombres
    resolver 127.0.0.11 valid=30s;



}

# [Bloque tickets.scspr.gob.gt omitido en dev local: apunta a 'proxy' (Plane),
# un contenedor de otro proyecto que no existe en este docker-compose.yml]
