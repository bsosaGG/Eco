server {
    listen 80;
    server_name localhost;

    # Redirigir / al admin panel
    location / {
        proxy_pass http://admin_app_container:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Redirigir /calendario al contenedor calendar_app
    location /calendario {
        proxy_pass http://calendar_app_container:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Reescribir path para que la app reciba / (aunque configuramos base=/calendario/ en vite, asi que quizás no sea necesario rewrite)
        # Si vite tiene base='/calendario/', entonces la app espera recibir /calendario/assets/...
        # Pero si nginx del contenedor sirve en /, entonces:
        # Peticion: /calendario/index.html -> Proxy -> http://container:80/calendario/index.html 
        # Si el contenedor tiene los archivos en root, esto dará 404.
        # OPCION 1: Build con base=/calendario/ y Nginx container sirve en / (default).
        # Nginx Proxy pass: http://calendar_app:80/calendario/
        # Pero los archivos estan en /usr/share/nginx/html/index.html
        # Asi que necesitamos un rewrite o mejor, configuración adecuada.
        
        # Si la app se construye con base '/calendario/', los assets pedirán /calendario/assets/foo.js
        # Al llegar aquí, location /calendario lo captura.
        # Si hacemos proxy_pass http://container:80/, entonces /calendario/index.html va a /index.html en el container.
        # /calendario/assets/foo.js va a /assets/foo.js en el container.
        # ESTO ES CORRECTO si el container tiene los archivos en la raiz.
        # PERO, OJO con la barra final en proxy_pass.
    }

    # Redirigir /calendario/api a la API, pero MANTENIENDO la ruta para que la API sepa qué hacer?
    # El usuario dijo: "redirigir todas sus peticiones a 'calendario' y 'calendario/api' a la app y al api"
    # La API está en http://denuncias_api_scspr:3000
    # Si la app hace request a /api/calendar... nosotros queremos que llegue a /api/calendar de la API.
    # En vite.config.js pusimos proxy '/api' -> localhost:3000. Eso es solo dev.
    # En prod, la app hará request a /calendario/api/... si configuramos axios baseURL.
    # O si axios usa path relativo 'api/...', al estar en /calendario/, será /calendario/api/...
    
    location /calendario/api/ {
        # Reescribir para quitar /calendario si la API no lo espera, pero la API tiene prefijo /api.
        # Si llega /calendario/api/auth/login -> queremos /api/auth/login
        rewrite ^/calendario/(.*) /$1 break;
        proxy_pass http://denuncias_api_scspr:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
